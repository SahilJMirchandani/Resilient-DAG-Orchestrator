name: Validate ORBIT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("static/index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>(.*?)</script>", html, re.S)
          if not match:
              raise SystemExit("No dashboard script block found")
          Path("/tmp/orbit-dashboard.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/orbit-dashboard.js
      - name: Run DAG validation tests
        run: python -m unittest discover -s tests -v
