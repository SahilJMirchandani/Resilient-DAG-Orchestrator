services:
  - type: web
    name: resilient-dag-orchestrator
    runtime: python
    plan: free
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
